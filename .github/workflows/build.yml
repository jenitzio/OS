name: Deploy Portable OS

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    container:
      image: debian:trixie
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            desktop-file-utils e2fsprogs file libfuse2 live-build \
            debootstrap qemu-utils squashfs-tools xorriso

      - name: Build MyPortableOS live image
        run: |
          ./os-recipe/build.sh "$GITHUB_WORKSPACE/os-payload"
          file os-payload/core.iso | grep -q 'ISO 9660'
          qemu-img info os-payload/persistence-base.qcow2

      - name: Prepare AppDir Structure
        run: |
          mkdir -p MyOS.AppDir/usr/bin
          mkdir -p MyOS.AppDir/usr/share/myos
          
          cp os-payload/core.iso MyOS.AppDir/usr/share/myos/
          cp os-payload/persistence-base.qcow2 MyOS.AppDir/usr/share/myos/
          cp appimage-recipe/AppRun MyOS.AppDir/
          chmod +x MyOS.AppDir/AppRun
          cp appimage-recipe/myos.desktop MyOS.AppDir/
          cp appimage-recipe/myos.svg MyOS.AppDir/
          desktop-file-validate MyOS.AppDir/myos.desktop

      - name: Build AppImage
        run: |
          curl -fL --retry 3 -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool MyOS.AppDir MyOS-x86_64.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myos-linux-appimage
          path: MyOS-x86_64.AppImage
          if-no-files-found: error

      - name: Upload OS Image
        uses: actions/upload-artifact@v4
        with:
          name: myos-os-payload
          path: |
            os-payload/core.iso
            os-payload/persistence-base.qcow2
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: build-ubuntu
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.14

      - name: Download OS Image
        uses: actions/download-artifact@v4
        with:
          name: myos-os-payload
          path: windows-package

      - name: Build Windows 7-compatible executable
        shell: pwsh
        run: |
          Copy-Item windows-recipe/launcher.go windows-package/launcher.go
          Push-Location windows-package
          try {
            $env:GOOS = "windows"
            $env:GOARCH = "amd64"
            go build -trimpath -ldflags "-X main.imageVersion=$env:GITHUB_SHA" -o ../MyOS-windows-x86_64.exe launcher.go
          } finally {
            Pop-Location
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myos-windows-executable
          path: MyOS-windows-x86_64.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-windows]
    steps:
      - name: Download Linux release asset
        uses: actions/download-artifact@v4
        with:
          name: myos-linux-appimage
          path: release-assets

      - name: Download Windows release asset
        uses: actions/download-artifact@v4
        with:
          name: myos-windows-executable
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
